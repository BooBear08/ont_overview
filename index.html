        function showPanel(key, evt) {
            const data = panelData[key];
            if (!data) return;

            document.getElementById('panelTitle').innerText = data.title;
            document.getElementById('panelSubtitle').innerText = data.subtitle;
            document.getElementById('infoCard').style.borderColor = data.color;
            document.getElementById('panelTitle').style.color = data.color;

            document.getElementById('panelDiagram').innerHTML = data.diagram;
            
            const textElem = document.getElementById('panelText');
            textElem.innerHTML = data.htmlText;

            const refList = document.getElementById('panelRefs');
            refList.innerHTML = '';
            data.refs.forEach(ref => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = ref.url;
                a.target = '_blank';
                a.innerHTML = ref.html;
                li.appendChild(a);
                refList.appendChild(li);
            });

            const segments = document.querySelectorAll('.segment');
            segments.forEach(seg => seg.classList.remove('active'));
            if (evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }
        }

        window.onload = function() {
            showPanel('age', null);
        };
